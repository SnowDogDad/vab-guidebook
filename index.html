<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Guidebook</title>
<meta name="description" content="Digital guidebook — check-in, wifi, house rules, local recommendations and more.">
<meta name="theme-color" content="#2e4029">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="styles/style.css">
</head>
<body>

<div class="app" id="app">

  <!-- HERO -->
  <header class="hero">
    <img id="hero-img" src="images/default-hero.jpg" alt="">
    <div class="hero-text">
      <p class="hero-eyebrow">Digital Guidebook</p>
      <h1 class="hero-title" id="hero-title">&nbsp;</h1>
      <p class="hero-subtitle" id="hero-subtitle"></p>
    </div>
  </header>

  <!-- WELCOME -->
  <section class="welcome">
    <h2 id="welcome-heading">Welcome!</h2>
    <p id="welcome-text">Loading&hellip;</p>
  </section>

  <!-- decorative mountain-ridge divider -->
  <div class="ridge" aria-hidden="true">
    <svg viewBox="0 0 400 40" preserveAspectRatio="none">
      <path class="ridge-range" d="M0 40 L0 27 L38 9 L66 27 L96 5 L128 27 L158 15 L192 31 L224 9 L252 27 L286 5 L318 27 L348 15 L400 27 L400 40 Z"/>
      <path class="ridge-peak" d="M96 5 L106 15 L86 15 Z"/>
      <path class="ridge-peak" d="M286 5 L296 15 L276 15 Z"/>
    </svg>
  </div>

  <!-- CATEGORY GRID -->
  <nav class="grid" id="grid" aria-label="Guidebook categories"></nav>

  <p class="footer" id="footer-note">Scan anytime you need this guide &middot; Have a wonderful stay</p>

  <!-- DETAIL SCREEN (single reusable panel) -->
  <section class="detail" id="detail" aria-hidden="true">
    <div class="detail-header">
      <button class="back-btn" id="back-btn" aria-label="Back to categories">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <div class="detail-heading">
        <h1 id="detail-title"></h1>
        <p id="detail-subtitle"></p>
      </div>
    </div>
    <div class="detail-body" id="detail-body"></div>
  </section>

</div>

<script src="scripts/app.js"></script>

</body>
</html>
